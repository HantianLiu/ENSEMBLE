[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ensemble-v071"
version = "0.7.5"
description = "Conservative governance and orchestration primitives for multi-model epistemic deliberation"
readme = "README_v071.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "reportlab>=4.2,<5",
  "pypdf>=5,<7",
  "matplotlib>=3.8,<4",
  "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
ensemble = "project_ensemble.cli:main"
ensemble-v071 = "project_ensemble.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_ensemble = ["assets/fonts/*.ttf", "assets/fonts/LICENSE.txt", "assets/reader_annotations.js", "assets/reader_markdown.js", "assets/reader_navigation.js", "assets/reader_focus.js", "assets/reader_annotations.css", "assets/reader_qa.html", "assets/skills/*/SKILL.md"]

[tool.setuptools.data-files]
"share/project-ensemble-v071" = ["README_v071.md", "README_v071.en.md", "THIRD_PARTY_NOTICES.md"]
"share/project-ensemble-v071/governance" = ["docs/governance/*.md"]
